# ProbeIQ backend service.
#
# NOTE: a PostgreSQL service is intentionally NOT defined here. Auth persistence
# uses SQLite via SQLAlchemy, which needs no extra container. The SQLite file
# (default app/data/probeiq.db) lives in the container's filesystem, so a rebuilt
# container starts with an empty auth database unless a volume is mounted or
# PROBEIQ_DATABASE_URL points at persistent storage.
services:
  backend:
    build: ./backend
    image: probeiq-backend
    container_name: probeiq-backend
    ports:
      - "8000:8000"
    # Optional: backend/.env is loaded if present (it is git-ignored and must
    # not be committed). Without it the service starts with the LLM disabled
    # and runs fully offline.
    env_file:
      - path: ./backend/.env
        required: false
    restart: unless-stopped
